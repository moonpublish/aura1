<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Health - ระบบดูแลสุขภาพ & เมตาบอลิซึมอัจฉริยะ</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Production UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'sans-serif'],
          },
          colors: {
            aura: {
              lime: '#A3E635',     // Neon Lime accent from reference
              limeDark: '#84CC16',
              royal: '#2563EB',    // Deep Royal Blue
              purple: '#4F46E5',   // Vivid Violet Indigo
              navy: '#0B0F19',     // Deep space base
              glassDark: 'rgba(15, 23, 42, 0.75)',
              glassLight: 'rgba(255, 255, 255, 0.85)'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Futuristic Glassmorphism Utilities */
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .neon-glow-lime {
      box-shadow: 0 0 20px rgba(163, 230, 53, 0.35);
    }
    .neon-glow-blue {
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.35);
    }
    /* Hide scrollbar for clean horizontal chips */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-100 min-h-screen selection:bg-aura-lime selection:text-slate-950">

  <div id="root">
    <!-- Initial Loading Fallback before React mounts -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0F19; color: white;">
      <div style="width: 48px; height: 48px; border: 4px solid #A3E635; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 16px; font-size: 14px; font-weight: 600; color: #94A3B8;">กำลังเริ่มต้นระบบ Aura Health AI...</p>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ZERO-DEPENDENCY SVG ICONS ---
    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
      const icons = {
        activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
        sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>,
        heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
        droplets: <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />,
        flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z" />,
        pill: <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>,
        camera: <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>,
        calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        check: <polyline points="20 6 9 17 4 12"/>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        chevronRight: <polyline points="9 18 15 12 9 6"/>,
        play: <polygon points="5 3 19 12 5 21 5 3"/>,
        shoppingCart: <><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>,
        shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></>,
        alertTriangle: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
        alertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
        send: <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
        sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
        moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
        x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        mapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,
        award: <><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>
      };

      return (
        <svg 
          className={className} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth={strokeWidth} 
          strokeLinecap="round" 
          strokeLinejoin="round"
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Requested menu order: หน้าหลัก, คอมมูนิตี้กีฬา, สแกน 3D, สแกนอาหาร, ตารางยา, ประเมินอาการ
      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(true);

      const [userStats, setUserStats] = useState({
        steps: 8420,
        stepsGoal: 10000,
        water: 1850,
        waterGoal: 2500,
        calories: 1420,
        caloriesGoal: 2100,
        protein: 85,
        carbs: 160,
        fat: 45,
        lastBodyFat: 19.4,
        muscleMass: 42.1
      });

      const [timeline, setTimeline] = useState([
        { id: 1, time: '08:00 น.', title: 'ทานยาเช้า (Metformin 500mg)', type: 'med', completed: true, tag: 'สุขภาพ' },
        { id: 2, time: '08:30 น.', title: 'บันทึกอาหารเช้า (ขนมปังอะโวคาโด & ไข่ต้ม)', type: 'food', completed: true, tag: '420 kcal' },
        { id: 3, time: '12:30 น.', title: 'บันทึกอาหารเที่ยง (สลัดแซลมอนคินัว)', type: 'food', completed: true, tag: '580 kcal' },
        { id: 4, time: '14:00 น.', title: 'จิบน้ำเพิ่มความสดชื่น (+500ml)', type: 'water', completed: true, tag: 'ดื่มน้ำ' },
        { id: 5, time: '18:00 น.', title: 'วิ่งออกกำลังกายกระชับต้นขา HIIT', type: 'workout', completed: false, tag: '35 นาที' },
        { id: 6, time: '20:00 น.', title: 'ทานวิตามินดี 3 & วิตามินก่อนนอน', type: 'med', completed: false, tag: 'วิตามิน' }
      ]);

      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleAddWater = (amount = 250) => {
        setUserStats(prev => ({ ...prev, water: Math.min(prev.waterGoal, prev.water + amount) }));
        showToast(`บันทึกการดื่มน้ำสำเร็จ: +${amount} มล. 💧`);
      };

      const toggleTimeline = (id) => {
        setTimeline(prev => prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item));
        showToast('อัปเดตสถานะกิจกรรมเรียบร้อยแล้ว');
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${
          darkMode 
            ? 'bg-gradient-to-b from-[#0F172A] via-[#1E1B4B] to-[#0A0E1A] text-slate-100' 
            : 'bg-gradient-to-b from-slate-100 via-indigo-50/40 to-slate-200 text-slate-800'
        }`}>
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2.5 bg-slate-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl border border-aura-lime/40 backdrop-blur-md animate-bounce">
              <Icon name="sparkles" className="w-5 h-5 text-aura-lime" />
              <span className="text-xs font-semibold">{toast.message}</span>
            </div>
          )}

          {/* Top Bar Header with Glass Effect */}
          <header className={`sticky top-0 z-40 px-4 sm:px-8 py-3.5 backdrop-blur-xl border-b transition-colors ${
            darkMode 
              ? 'bg-[#0F172A]/70 border-white/10' 
              : 'bg-white/80 border-slate-200 shadow-sm'
          }`}>
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* App Identity */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aura-lime to-emerald-500 p-0.5 shadow-lg shadow-aura-lime/20 flex items-center justify-center">
                  <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                    <Icon name="activity" className="w-5 h-5 text-aura-lime" />
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-lg font-black tracking-tight text-white bg-gradient-to-r from-white via-slate-100 to-aura-lime bg-clip-text text-transparent">
                      Aura Health
                    </span>
                    <span className="text-[10px] font-black uppercase tracking-wider bg-aura-lime/20 text-aura-lime px-2 py-0.5 rounded-full border border-aura-lime/30">
                      AI 2026
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">ระบบสุขภาพและคอมมูนิตี้ฟิตเนสอัจฉริยะ</p>
                </div>
              </div>

              {/* Top Controls: Profile + Dark Mode Toggle */}
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className={`p-2.5 rounded-2xl border transition-all ${
                    darkMode 
                      ? 'bg-slate-800/80 border-slate-700 text-aura-lime hover:bg-slate-700' 
                      : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-100 shadow-sm'
                  }`}
                  title="สลับโหมด Dark / Light"
                >
                  <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                </button>

                <div className="hidden sm:flex items-center gap-3 pl-2 border-l border-white/10">
                  <div className="text-right">
                    <div className="text-xs font-bold">คุณศิรินทร์ เจนกิตติ์</div>
                    <div className="text-[10px] text-aura-lime font-semibold flex items-center justify-end gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-aura-lime animate-pulse"></span>
                      เป้าหมายวันนี้ 82%
                    </div>
                  </div>
                  <img 
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" 
                    alt="User" 
                    className="w-10 h-10 rounded-2xl object-cover border-2 border-aura-lime shadow-md"
                  />
                </div>
              </div>

            </div>
          </header>

          {/* MAIN APP CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-28">
            {activeTab === 'dashboard' && (
              <DashboardView 
                darkMode={darkMode}
                userStats={userStats} 
                handleAddWater={handleAddWater} 
                timeline={timeline}
                toggleTimeline={toggleTimeline}
                setActiveTab={setActiveTab}
              />
            )}
            {activeTab === 'community' && (
              <CommunitySportsView 
                darkMode={darkMode}
                showToast={showToast}
                setTimeline={setTimeline}
              />
            )}
            {activeTab === 'scan3d' && (
              <FitnessBodyScanView 
                darkMode={darkMode}
                userStats={userStats} 
                setUserStats={setUserStats}
                showToast={showToast}
              />
            )}
            {activeTab === 'nutrition' && (
              <FoodScannerView 
                darkMode={darkMode}
                userStats={userStats} 
                setUserStats={setUserStats}
                setTimeline={setTimeline}
                showToast={showToast}
              />
            )}
            {activeTab === 'meds' && (
              <MedicationTrackerView 
                darkMode={darkMode}
                showToast={showToast}
              />
            )}
            {activeTab === 'telemedicine' && (
              <TelemedicineView 
                darkMode={darkMode}
                showToast={showToast}
              />
            )}
          </main>

          {/* Persistent Futuristic Bottom Navigation Bar */}
          {/* Requested Order: 1.หน้าหลัก, 2.คอมมูนิตี้กีฬา, 3.สแกน 3D, 4.สแกนอาหาร, 5.ตารางยา, 6.ประเมินอาการ */}
          <nav className={`fixed bottom-0 inset-x-0 z-40 backdrop-blur-2xl border-t transition-colors ${
            darkMode 
              ? 'bg-[#0B0F19]/90 border-white/10' 
              : 'bg-white/95 border-slate-200 shadow-2xl'
          }`}>
            <div className="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between">
              
              <NavItem 
                icon="activity" 
                label="หน้าหลัก" 
                active={activeTab === 'dashboard'} 
                onClick={() => setActiveTab('dashboard')} 
                darkMode={darkMode}
              />
              <NavItem 
                icon="users" 
                label="คอมมูนิตี้กีฬา" 
                active={activeTab === 'community'} 
                onClick={() => setActiveTab('community')} 
                darkMode={darkMode}
              />
              <NavItem 
                icon="award" 
                label="สแกน 3D" 
                active={activeTab === 'scan3d'} 
                onClick={() => setActiveTab('scan3d')} 
                darkMode={darkMode}
              />
              <NavItem 
                icon="camera" 
                label="สแกนอาหาร" 
                active={activeTab === 'nutrition'} 
                onClick={() => setActiveTab('nutrition')} 
                highlight
                darkMode={darkMode}
              />
              <NavItem 
                icon="pill" 
                label="ตารางยา" 
                active={activeTab === 'meds'} 
                onClick={() => setActiveTab('meds')} 
                darkMode={darkMode}
              />
              <NavItem 
                icon="heart" 
                label="ประเมินอาการ" 
                active={activeTab === 'telemedicine'} 
                onClick={() => setActiveTab('telemedicine')} 
                darkMode={darkMode}
              />

            </div>
          </nav>

        </div>
      );
    }

    // Nav Item Helper
    function NavItem({ icon, label, active, onClick, highlight, darkMode }) {
      return (
        <button 
          onClick={onClick}
          className={`flex flex-col items-center justify-center py-1.5 px-2.5 rounded-2xl transition-all duration-200 ${
            active 
              ? 'bg-aura-lime text-slate-950 font-black shadow-lg shadow-aura-lime/25 scale-105' 
              : darkMode 
                ? 'text-slate-400 hover:text-white hover:bg-white/5' 
                : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'
          }`}
        >
          <div className="relative">
            <Icon name={icon} className="w-5 h-5" strokeWidth={active ? 2.5 : 2} />
            {highlight && !active && (
              <span className="absolute -top-1 -right-1 w-2 h-2 bg-aura-lime rounded-full animate-ping"></span>
            )}
          </div>
          <span className="text-[10px] mt-1 tracking-tight">{label}</span>
        </button>
      );
    }

    // ==========================================
    // 1. DASHBOARD MODULE (หน้าหลัก)
    // ==========================================
    function DashboardView({ darkMode, userStats, handleAddWater, timeline, toggleTimeline, setActiveTab }) {
      return (
        <div className="space-y-6">
          
          {/* Reference Futuristic Hero Banner */}
          <div className="relative rounded-3xl overflow-hidden bg-gradient-to-r from-blue-700 via-indigo-700 to-aura-navy p-6 sm:p-8 border border-white/20 shadow-2xl">
            <div className="absolute top-0 right-0 w-96 h-96 bg-aura-lime/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div className="space-y-3 max-w-xl">
                <div className="inline-flex items-center gap-2 bg-black/40 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-aura-lime border border-aura-lime/30">
                  <Icon name="zap" className="w-3.5 h-3.5" /> ซิงค์ข้อมูลอัตโนมัติจาก Apple Health & Garmin
                </div>
                <h2 className="text-2xl sm:text-4xl font-black text-white tracking-tight">
                  สวัสดีตอนเช้า, คุณศิรินทร์! 👋
                </h2>
                <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">
                  วันนี้คุณทำเป้าหมายสำเร็จไปแล้ว <strong className="text-aura-lime font-bold">82%</strong> โปรแกรมกระชับต้นขาและคุมระดับน้ำตาลตอบสนองได้อย่างดีเยี่ยม
                </p>
              </div>

              <div className="flex flex-wrap sm:flex-col gap-3">
                <button 
                  onClick={() => setActiveTab('community')}
                  className="px-5 py-3 rounded-2xl bg-aura-lime text-slate-950 font-black text-xs hover:bg-aura-limeDark transition-all shadow-lg shadow-aura-lime/20 flex items-center gap-2"
                >
                  <Icon name="users" className="w-4 h-4" /> เข้าร่วมคอมมูนิตี้กีฬา
                </button>
                <button 
                  onClick={() => setActiveTab('scan3d')}
                  className="px-5 py-3 rounded-2xl bg-white/10 hover:bg-white/20 backdrop-blur-md text-white font-bold text-xs border border-white/20 transition-all flex items-center gap-2"
                >
                  <Icon name="award" className="w-4 h-4" /> สแกนเรือนร่าง 3D AI
                </button>
              </div>
            </div>
          </div>

          {/* Quick Metrics Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            {/* Steps Card */}
            <div className={`p-5 rounded-3xl border transition-all ${
              darkMode ? 'glass-card-dark' : 'glass-card-light'
            }`}>
              <div className="flex items-center justify-between mb-3">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">ก้าวเดินวันนี้</span>
                <span className="p-2 rounded-xl bg-blue-500/20 text-blue-400"><Icon name="activity" className="w-4 h-4" /></span>
              </div>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-2xl font-black">{userStats.steps.toLocaleString()}</div>
                  <div className="text-[11px] text-slate-400">เป้าหมาย {userStats.stepsGoal.toLocaleString()} ก้าว</div>
                </div>

            const costPerPlayer = selectedVenue.baseCost / players;
            venueShare = Math.round(costPerPlayer * 1.6); // 160%
          } else {
            venueShare = Math.round((selectedVenue.baseCost / 6) * 1.6);
          }
        }

        const trainerFee = (bookingOption === 'with_trainer' && selectedTrainer) ? selectedTrainer.rate : 0;
        return { venueShare, trainerFee, total: venueShare + trainerFee };
      };

      const prices = calculatePrice();

      const handleConfirmBooking = () => {
        if (!selectedVenue || !selectedTimeSlot) {
          showToast('กรุณาเลือกสถานที่และช่วงเวลาที่ต้องการจอง', 'warning');
          return;
        }
        if (bookingOption === 'with_trainer' && !selectedTrainer) {
          showToast('กรุณาเลือกโค้ชผู้ฝึกสอน', 'warning');
          return;
        }

        const bookingTitle = `${selectedSport === 'badminton' ? '🏸 แบดมินตัน' : '🏃 วิ่ง'} @ ${selectedVenue.name} (${selectedTimeSlot})`;
        setTimeline(prev => [
          ...prev,
          {
            id: Date.now(),
            time: selectedTimeSlot.split(' - ')[0] + ' น.',
            title: bookingTitle,
            type: 'workout',
            completed: false,
            tag: `฿${prices.total}`
          }
        ]);

        showToast(`จองคลาสสำเร็จ! ยอดชำระ ฿${prices.total} (เพิ่มลงไทม์ไลน์แล้ว)`);
        setSelectedVenue(null);
        setSelectedTimeSlot(null);
        setSelectedTrainer(null);
      };

      const currentVenues = (venues[selectedSport] && venues[selectedSport][selectedProvince]) || [];

      return (
        <div className="space-y-6">
          
          {/* Header */}
          <div className="p-6 rounded-3xl bg-gradient-to-r from-blue-700 via-indigo-800 to-slate-900 border border-white/20 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <span className="text-[10px] font-black uppercase tracking-wider bg-aura-lime text-slate-950 px-2.5 py-0.5 rounded-full">
                Sports Community Hub
              </span>
              <h2 className="text-2xl font-black mt-2">ศูนย์รวมคอมมูนิตี้กีฬา & จองคลาสพร้อมโค้ช</h2>
              <p className="text-xs text-slate-200 mt-1 max-w-xl">
                เลือกเล่นร่วมกับสมาชิกคอมมูนิตี้ หรือเลือกเรียนแบบมีโค้ชประกบ 1 ชม. คิดค่าบริการตามจริง + ค่าสมาชิก 160% (สวนสาธารณะฟรีค่าสถานที่)
              </p>
            </div>
            <div className="flex gap-2 bg-black/40 p-1.5 rounded-2xl border border-white/10">
              <button 
                onClick={() => setSelectedSport('badminton')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                  selectedSport === 'badminton' ? 'bg-aura-lime text-slate-950 shadow-md' : 'text-slate-300'
                }`}
              >
                🏸 แบดมินตัน
              </button>
              <button 
                onClick={() => setSelectedSport('running')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                  selectedSport === 'running' ? 'bg-aura-lime text-slate-950 shadow-md' : 'text-slate-300'
                }`}
              >
                🏃 วิ่งเพื่อสุขภาพ
              </button>
            </div>
          </div>

          {/* Province Selector */}
          <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
            {[
              { id: 'bkk', name: '📍 กรุงเทพฯ และปริมณฑล (10+ แห่ง)' },
              { id: 'chonburi', name: '📍 ชลบุรี / บางแสน / พัทยา (10+ แห่ง)' },
              { id: 'chiangmai', name: '📍 เชียงใหม่ / มช. (10+ แห่ง)' }
            ].map(p => (
              <button
                key={p.id}
                onClick={() => { setSelectedProvince(p.id); setSelectedVenue(null); }}
                className={`px-4 py-2 rounded-2xl text-xs font-bold whitespace-nowrap transition-all border ${
                  selectedProvince === p.id 
                    ? 'bg-aura-lime text-slate-950 border-aura-lime shadow-lg shadow-aura-lime/20' 
                    : darkMode 
                      ? 'bg-slate-900 border-white/10 text-slate-400 hover:text-white' 
                      : 'bg-white border-slate-200 text-slate-600 hover:text-slate-900'
                }`}
              >
                {p.name}
              </button>
            ))}
          </div>

          {/* Venues Grid */}
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-300">เลือกสนาม / สถานที่จัดกิจกรรม ({currentVenues.length} แห่ง)</h3>
              {selectedSport === 'badminton' && (
                <div className="flex items-center gap-1 bg-black/30 p-1 rounded-xl text-[11px] font-bold">
                  <span className="text-slate-400 px-1">ประเภท:</span>
                  <button 
                    onClick={() => setBadmintonMode('double')} 
                    className={`px-2 py-0.5 rounded-lg ${badmintonMode === 'double' ? 'bg-aura-lime text-slate-950' : 'text-slate-400'}`}
                  >
                    ตีคู่ (4 คน)
                  </button>
                  <button 
                    onClick={() => setBadmintonMode('single')} 
                    className={`px-2 py-0.5 rounded-lg ${badmintonMode === 'single' ? 'bg-aura-lime text-slate-950' : 'text-slate-400'}`}
                  >
                    เดี่ยว (2 คน)
                  </button>
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              {currentVenues.map((v) => {
                const isSelected = selectedVenue?.id === v.id;
                let calculatedFee = 0;
                if (v.type === 'private') {
                  const div = selectedSport === 'badminton' ? (badmintonMode === 'double' ? 4 : 2) : 6;
                  calculatedFee = Math.round((v.baseCost / div) * 1.6);
                }

                return (
                  <div
                    key={v.id}
                    onClick={() => setSelectedVenue(v)}
                    className={`p-4 rounded-2xl border cursor-pointer transition-all ${
                      isSelected 
                        ? 'border-aura-lime bg-aura-lime/10 shadow-lg shadow-aura-lime/15' 
                        : darkMode 
                          ? 'glass-card-dark hover:border-slate-600' 
                          : 'glass-card-light hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded ${
                        v.type === 'public' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-400'
                      }`}>
                        {v.type === 'public' ? 'สนามสาธารณะ (ฟรี)' : 'สนามเอกชนมาตรฐาน'}
                      </span>
                      <span className="text-xs font-black text-aura-lime">
                        {v.type === 'public' ? '฿0 ฟรี' : `฿${calculatedFee} / คน / ชม.`}
                      </span>
                    </div>

                    <h4 className="text-sm font-bold mt-2">{v.name}</h4>
                    <div className="text-[11px] text-slate-400 mt-1 flex items-center justify-between">
                      <span>⏱️ {v.open}</span>
                      <span>📍 {v.loc}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Booking Config Modal / Panel */}
          {selectedVenue && (
            <div className={`p-6 rounded-3xl border-2 border-aura-lime space-y-5 animate-fadeIn ${
              darkMode ? 'bg-slate-900' : 'bg-white'
            }`}>
              <div className="flex items-center justify-between border-b border-white/10 pb-3">
                <div>
                  <span className="text-[10px] text-aura-lime font-bold uppercase">ดำเนินการจองกิจกรรม</span>
                  <h3 className="text-lg font-bold">{selectedVenue.name}</h3>
                </div>
                <button 
                  onClick={() => setSelectedVenue(null)} 
                  className="p-1 rounded-full hover:bg-white/10 text-slate-400"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>

              {/* Step 1: Choose Option */}
              <div className="space-y-2">
                <label className="text-xs font-bold text-slate-300">1. เลือกรูปแบบการเข้าร่วม:</label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div 
                    onClick={() => setBookingOption('community_only')}
                    className={`p-4 rounded-2xl border cursor-pointer transition-all ${
                      bookingOption === 'community_only' 
                        ? 'border-aura-lime bg-aura-lime/10' 
                        : 'border-slate-700 bg-white/5'
                    }`}
                  >
                    <div className="font-bold text-xs flex items-center justify-between">
                      <span>เข้าร่วมกลุ่มคอมมูนิตี้อย่างเดียว (Only Join)</span>
                      <span className="text-aura-lime font-black">฿{prices.venueShare}</span>
                    </div>
                    <p className="text-[11px] text-slate-400 mt-1">เล่นและซ้อมร่วมกับเพื่อนๆ สมาชิกในคลับ</p>
                  </div>

                  <div 
                    onClick={() => setBookingOption('with_trainer')}
                    className={`p-4 rounded-2xl border cursor-pointer transition-all ${
                      bookingOption === 'with_trainer' 
                        ? 'border-aura-lime bg-aura-lime/10' 
                        : 'border-slate-700 bg-white/5'
                    }`}
                  >
                    <div className="font-bold text-xs flex items-center justify-between">
                      <span>เข้าร่วมกลุ่ม + โค้ชสอนประกบ 1 ชม.</span>
                      <span className="text-aura-lime font-black">+ ค่าโค้ชตามเรท</span>
                    </div>
                    <p className="text-[11px] text-slate-400 mt-1">มีเทรนเนอร์มืออาชีพดูแลตัวต่อตัวตลอด 1 ชั่วโมง</p>
                  </div>
                </div>
              </div>

              {/* Step 2: Choose Trainer (if needed) */}
              {bookingOption === 'with_trainer' && (
                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-300">2. เลือกโค้ชเทรนเนอร์ชาวไทย (7 ท่าน):</label>
                  <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
                    {thaiTrainers.map((t) => (
                      <div 
                        key={t.id}
                        onClick={() => setSelectedTrainer(t)}
                        className={`p-2.5 rounded-2xl border text-center cursor-pointer transition-all ${
                          selectedTrainer?.id === t.id 
                            ? 'border-aura-lime bg-aura-lime/20' 
                            : 'border-slate-700 bg-white/5'
                        }`}
                      >
                        <img src={t.img} alt={t.name} className="w-12 h-12 rounded-xl object-cover mx-auto border border-white/20" />
                        <div className="text-[11px] font-bold mt-1.5 truncate">{t.name}</div>
                        <div className="text-[9px] text-slate-400">{t.exp}</div>
                        <div className="text-[10px] font-black text-aura-lime mt-1">฿{t.rate}/ชม.</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Step 3: Choose Time Slot */}
              <div className="space-y-2">
                <label className="text-xs font-bold text-slate-300">3. เลือกรอบเวลา (วันธรรมดา 16:00 - 24:00 น. ความถี่ทุก 1 ชม.):</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {hourlySlots.map((slot) => (
                    <button
                      key={slot}
                      onClick={() => setSelectedTimeSlot(slot)}
                      className={`p-2.5 rounded-xl text-xs font-bold border transition-all ${
                        selectedTimeSlot === slot 
                          ? 'border-aura-lime bg-aura-lime text-slate-950 font-black' 
                          : 'border-slate-700 bg-white/5 text-slate-300 hover:border-slate-500'
                      }`}
                    >
                      {slot}
                    </button>
                  ))}
                </div>
              </div>

              {/* Price Summary & Confirm */}
              <div className="pt-3 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="text-left w-full sm:w-auto">
                  <div className="text-xs text-slate-400">ยอดชำระสุทธิ (รวมภาษีและค่าสนาม):</div>
                  <div className="text-2xl font-black text-aura-lime">
                    ฿{prices.total} <span className="text-xs text-slate-400 font-normal">/ 1 ชั่วโมง</span>
                  </div>
                </div>

                <button 
                  onClick={handleConfirmBooking}
                  className="w-full sm:w-auto px-8 py-3 bg-aura-lime hover:bg-aura-limeDark text-slate-950 font-black text-xs rounded-2xl shadow-xl shadow-aura-lime/20 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="check" className="w-4 h-4" /> ยืนยันการจองคลาส
                </button>
              </div>

            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 3. FITNESS & 3D BODY SCAN (สแกน 3D)
    // ==========================================
    function FitnessBodyScanView({ darkMode, userStats, setUserStats, showToast }) {
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0);

      const handleStartScan = () => {
        setScanning(true);
        setScanProgress(0);

        const interval = setInterval(() => {
          setScanProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              setScanning(false);
              setUserStats(s => ({ ...s, lastBodyFat: 18.9, muscleMass: 42.8 }));
              showToast('สแกนสรีระ AI 3D สำเร็จ! อัปเดตสัดส่วนไขมันและกล้ามเนื้อแล้ว');
              return 100;
            }
            return prev + 25;
          });
        }, 500);
      };

      return (
        <div className="space-y-6">
          
          {/* Futuristic Anatomical Scan Card (Inspired by reference pic 1) */}
          <div className="p-6 sm:p-8 rounded-3xl bg-gradient-to-r from-blue-900 via-indigo-950 to-slate-950 border border-white/20 text-white relative overflow-hidden shadow-2xl">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
              
              {/* Left Column: Vision & Hologram Visual */}
              <div className="aspect-[4/3] rounded-2xl bg-slate-900/80 border-2 border-aura-lime/40 relative flex flex-col items-center justify-center p-4 overflow-hidden">
                {scanning ? (
                  <div className="text-center space-y-3">
                    <div className="w-16 h-16 border-4 border-aura-lime border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <div className="text-aura-lime font-mono text-sm tracking-widest uppercase animate-pulse">
                      ระบบ AI กำลังวิเคราะห์สัดส่วน... {scanProgress}%
                    </div>
                  </div>
                ) : (
                  <div className="text-center space-y-4">
                    <div className="w-24 h-36 border-2 border-dashed border-aura-lime/60 rounded-2xl mx-auto flex items-center justify-center relative">
                      <Icon name="activity" className="w-8 h-8 text-aura-lime animate-pulse" />
                    </div>
                    <button 
                      onClick={handleStartScan}
                      className="px-6 py-2.5 bg-aura-lime text-slate-950 font-black text-xs rounded-xl shadow-lg hover:bg-aura-limeDark transition-all flex items-center gap-2 mx-auto"
                    >
                      <Icon name="camera" className="w-4 h-4" /> เริ่มสแกนโครงร่าง 3D AI
                    </button>
                  </div>
                )}
              </div>

              {/* Right Column: Scan Metrics */}
              <div className="space-y-4">
                <span className="text-[10px] font-bold uppercase tracking-wider text-aura-lime bg-aura-lime/10 px-2.5 py-1 rounded-full">
                  AI Computer Vision Biomarkers
                </span>
                <h3 className="text-2xl font-black">ผลวิเคราะห์สรีระและมวลไขมัน</h3>
                <p className="text-xs text-slate-300">
                  ระบบกล้องเลเซอร์จำลองชั้นไขมันใต้ผิวหนังบริเวณหน้าท้อง สะโพก และต้นขา
                </p>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <div className="p-4 rounded-2xl bg-white/5 border border-white/10">
                    <div className="text-[11px] text-slate-400">สัดส่วนไขมัน (Body Fat)</div>
                    <div className="text-2xl font-black text-aura-lime">{userStats.lastBodyFat}%</div>
                    <div className="text-[10px] text-emerald-400">↓ ลดลง -0.5% ในสัปดาห์นี้</div>
                  </div>

                  <div className="p-4 rounded-2xl bg-white/5 border border-white/10">
                    <div className="text-[11px] text-slate-400">มวลกล้ามเนื้อ (Muscle)</div>
                    <div className="text-2xl font-black text-blue-400">{userStats.muscleMass} กก.</div>
                    <div className="text-[10px] text-blue-300">↑ เพิ่มขึ้น +0.3 กก.</div>
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-white/5 border border-white/10 text-xs">
                  <div className="font-semibold text-slate-300">โซนไขมันสะสมเป้าหมาย (Heatmap):</div>
                  <div className="flex justify-between text-[11px] text-slate-400 mt-1">
                    <span>ไขมันสะสมต้นขาด้านใน</span>
                    <span className="text-aura-lime font-bold">ปานกลาง (กำลังลดลง)</span>
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>
      );
    }

    // ==========================================
    // 4. AI FOOD SCANNER MODULE (สแกนอาหาร)
    // ==========================================
    function FoodScannerView({ darkMode, userStats, setUserStats, setTimeline, showToast }) {
      const [analyzing, setAnalyzing] = useState(false);
      const [analyzedFood, setAnalyzedFood] = useState(null);

      const sampleFoods = [
        {
          name: 'ขนมปังอะโวคาโด & ไข่ต้ม',
          calories: 420,
          protein: 18,
          carbs: 32,
          fat: 22,
          glycemicIndex: 'ต่ำ (GI 35)',
          alignment: 'เหมาะอย่างยิ่งสำหรับการกระชับต้นขาและป้องกันระดับน้ำตาลในเลือดพุ่งสูง',
          image: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&q=80&w=500'
        },
        {
          name: 'สลัดแซลมอนย่างคินัวพาวเวอร์โบวล์',
          calories: 580,
          protein: 42,
          carbs: 45,
          fat: 20,
          glycemicIndex: 'ต่ำมาก (GI 28)',
          alignment: 'โปรตีนสูงช่วยฟื้นฟูกล้ามเนื้อและเร่งอัตราการเผาผลาญไขมัน',
          image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&q=80&w=500'
        },
        {
          name: 'มัทฉะลาเต้เย็น & มัฟฟินเบอร์รี',
          calories: 360,
          protein: 6,
          carbs: 58,
          fat: 12,
          glycemicIndex: 'ปานกลาง (GI 58)',
          alignment: 'มีคาร์โบไฮเดรตปานกลาง ควรรับประทานก่อนออกกำลังกายคาร์ดิโอ',
          image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&q=80&w=500'
        }
      ];

      const handleSelectSample = (food) => {
        setAnalyzing(true);
        setAnalyzedFood(null);

        setTimeout(() => {
          setAnalyzing(false);
          setAnalyzedFood(food);
        }, 1200);
      };

      const handleLogFood = () => {
        if (!analyzedFood) return;

        setUserStats(prev => ({
          ...prev,
          calories: prev.calories + analyzedFood.calories,
          protein: prev.protein + analyzedFood.protein,
          carbs: prev.carbs + analyzedFood.carbs,
          fat: prev.fat + analyzedFood.fat
        }));

        setTimeline(prev => [
          ...prev,
          {
            id: Date.now(),
            time: 'เมื่อสักครู่',
            title: `บันทึกอาหาร: ${analyzedFood.name}`,
            type: 'food',
            completed: true,
            tag: `${analyzedFood.calories} kcal`
          }
        ]);

        showToast(`บันทึก ${analyzedFood.name} (${analyzedFood.calories} kcal) ลงตารางเรียบร้อย!`);
        setAnalyzedFood(null);
      };

      return (
        <div className="space-y-6">
          
          {/* Header Banner */}
          <div className="p-6 rounded-3xl bg-gradient-to-r from-emerald-600 via-teal-700 to-indigo-800 border border-white/20 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div>
              <span className="text-[10px] font-black uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">
                AI Computer Vision สแกนวัตถุดิบ
              </span>
              <h2 className="text-2xl font-black mt-2">สแกนถ่ายรูปอาหาร & ติดตามเมตาบอลิซึม Real-time</h2>
              <p className="text-xs text-teal-100 mt-1 max-w-xl">
                เพียงถ่ายรูปจานอาหาร Aura Health AI จะคำนวณแคลอรี สารอาหารหลัก และประเมินผลกระทบต่อเป้าหมายกระชับต้นขาและคุมน้ำตาลให้อัตโนมัติ
              </p>
            </div>
            <div className="p-3 bg-white/10 rounded-2xl border border-white/20">
              <Icon name="camera" className="w-8 h-8 text-aura-lime" />
            </div>
          </div>

          {/* Sample Food Selection */}

                { 
                  name: 'โปรไบโอติกส์ Probiotics Complex 10B', 
                  price: '990 บาท', 
                  tag: 'AI แนะนำ', 
                  properties: 'ปรับสมดุลจุลินทรีย์ในลำไส้ ช่วยการย่อยและขับถ่าย บรรเทาอาการท้องอืด และช่วยการดูดซึมสารอาหาร',
                  detail: 'บรรจุ 30 แคปซูล (รับประทานก่อนนอนวันละ 1 แคปซูล)'
                }
              ].map((prod, i) => (
                <div key={i} className="p-4 rounded-2xl border border-white/10 bg-white/5 flex flex-col justify-between space-y-3">
                  <div>
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold text-aura-lime bg-aura-lime/10 px-2 py-0.5 rounded">
                        {prod.tag}
                      </span>
                      <span className="text-[10px] font-bold text-emerald-400">⚡ จัดส่งใน 1 ชม.</span>
                    </div>
                    <h4 className="text-xs sm:text-sm font-bold mt-2">{prod.name}</h4>
                    <p className="text-[10px] text-slate-400 mt-0.5">{prod.detail}</p>
                    <p className="text-[11px] text-slate-300 mt-2 leading-relaxed bg-black/20 p-2 rounded-xl">
                      {prod.properties}
                    </p>
                  </div>

                  <div className="pt-2 border-t border-white/10 flex items-center justify-between">
                    <span className="text-sm font-black text-aura-lime">{prod.price}</span>
                    <button 
                      onClick={() => handleAddToCart(prod.name)}
                      className="px-3 py-1.5 bg-aura-lime text-slate-950 font-black text-xs rounded-xl hover:bg-aura-limeDark transition-all"
                    >
                      สั่งซื้อทันที
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Add Medication Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-white/20 rounded-3xl max-w-md w-full p-6 space-y-4 text-white">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold">+ เพิ่มยาใหม่เข้าตารางเตือน</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveMedication} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">ชื่อยา / เวชภัณฑ์ *</label>
                    <input 
                      type="text" 
                      required
                      placeholder="เช่น Amoxicillin 500mg"
                      value={newMedForm.name}
                      onChange={e => setNewMedForm({ ...newMedForm, name: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-aura-lime"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">หมวดหมู่</label>
                      <select 
                        value={newMedForm.category}
                        onChange={e => setNewMedForm({ ...newMedForm, category: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-800 border border-white/10 text-white"
                      >
                        <option value="ยาประจำตัว">ยาประจำตัว</option>
                        <option value="ยารักษาตามอาการ">ยารักษาตามอาการ</option>
                        <option value="วิตามิน/อาหารเสริม">วิตามิน/อาหารเสริม</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1">ขนาดรับประทาน</label>
                      <input 
                        type="text" 
                        value={newMedForm.dosage}
                        onChange={e => setNewMedForm({ ...newMedForm, dosage: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">จังหวะเวลา</label>
                      <input 
                        type="text" 
                        value={newMedForm.timing}
                        onChange={e => setNewMedForm({ ...newMedForm, timing: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">เวลาแจ้งเตือน</label>
                      <input 
                        type="text" 
                        value={newMedForm.time}
                        onChange={e => setNewMedForm({ ...newMedForm, time: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white"
                      />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      type="submit"
                      className="flex-1 py-2.5 bg-aura-lime text-slate-950 font-black text-xs rounded-xl hover:bg-aura-limeDark"
                    >
                      บันทึกรายการยา
                    </button>
                    <button 
                      type="button" 
                      onClick={() => setIsAddModalOpen(false)}
                      className="px-4 py-2.5 bg-white/10 text-slate-300 rounded-xl"
                    >
                      ยกเลิก
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 6. AI HEALTH TRIAGE (ประเมินอาการ)
    // ==========================================
    function TelemedicineView({ darkMode, showToast }) {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'สวัสดีครับคุณศิรินทร์ 👋 ผมคือระบบคัดกรองอาการเบื้องต้น Aura AI ปัจจุบันคุณมีอาการไม่สบายหรือต้องการคำปรึกษาด้านใดครับ?' }
      ]);
      const [inputText, setInputText] = useState('');
      const [triageResult, setTriageResult] = useState(null);

      const handleSendMessage = (textToSend = inputText) => {
        if (!textToSend.trim()) return;

        setMessages(prev => [...prev, { sender: 'user', text: textToSend }]);
        setInputText('');

        setTimeout(() => {
          let aiMsg = '';
          let triageData = null;

          if (textToSend.includes('เจ็บคอ') || textToSend.includes('ไข้') || textToSend.includes('หวัด')) {
            aiMsg = 'ประเมินจากอาการเบื้องต้น (ไข้ต่ำและเจ็บคอ) ตรงกับหวัดธรรมดาหรือทางเดินหายใจอักเสบเล็กน้อย';
            triageData = {
              grade: 'สีเขียว (ความรุนแรงปานกลาง/ยาสามัญ)',
              recommendation: 'พักผ่อนให้เพียงพอ ดื่มน้ำอุ่น และรับประทานยาพาราเซตามอลบรรเทาไข้',
              bundleName: 'ชุดยาสามัญบรรเทาไข้หวัด & เจ็บคอส่งด่วน 1 ชม.',
              price: '350 บาท'
            };
          } else {
            aiMsg = 'อาการเบื้องต้นจัดอยู่ในเกณฑ์ความรุนแรงต่ำ แนะนำให้เฝ้าระวังและสังเกตอาการต่อเนื่องครับ';
            triageData = {
              grade: 'สีเขียว (ความรุนแรงต่ำ)',
              recommendation: 'จิบน้ำให้เพียงพอและยืดเหยียดผ่อนคลายกล้ามเนื้อ',
              bundleName: 'ชุดเกลือแร่และวิตามินเสริมภูมิคุ้มกันส่งด่วน',
              price: '290 บาท'
            };
          }

          setMessages(prev => [...prev, { sender: 'ai', text: aiMsg }]);
          setTriageResult(triageData);
        }, 1000);
      };

      return (
        <div className="space-y-6">
          <div className="p-6 rounded-3xl bg-gradient-to-r from-indigo-700 via-blue-800 to-slate-900 border border-white/20 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div>
              <span className="text-[10px] font-black uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">
                AI Health Triage Chatbot
              </span>
              <h2 className="text-2xl font-black mt-2">AI ประเมินอาการเบื้องต้น & บริการส่งยาด่วน</h2>
              <p className="text-xs text-indigo-100 mt-1 max-w-xl">
                ประเมินความรุนแรงผ่านระบบ AI อัจฉริยะ (แบ่งระดับ เขียว/เหลือง/แดง) พร้อมส่งยาสามัญถึงบ้านใน 1 ชม.
              </p>
            </div>
            <div className="p-3 bg-white/10 rounded-2xl border border-white/20">
              <Icon name="heart" className="w-8 h-8 text-aura-lime" />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Chat Box */}
            <div className={`lg:col-span-2 p-5 rounded-3xl border flex flex-col h-[460px] ${
              darkMode ? 'glass-card-dark' : 'glass-card-light'
            }`}>
              <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs ${
                      m.sender === 'user' 
                        ? 'bg-aura-lime text-slate-950 font-bold rounded-br-none' 
                        : 'bg-white/10 text-white rounded-bl-none'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              {/* Quick Chips */}
              <div className="pt-2 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
                <button 
                  onClick={() => handleSendMessage('มีอาการเจ็บคอและมีไข้ต่ำๆ')}
                  className="text-[11px] bg-white/10 hover:bg-white/20 text-slate-200 px-3 py-1 rounded-full whitespace-nowrap"
                >
                  🤒 เจ็บคอ มีไข้ต่ำๆ
                </button>
                <button 
                  onClick={() => handleSendMessage('รู้สึกปวดเมื่อยกล้ามเนื้อต้นขาหลังวิ่ง')}
                  className="text-[11px] bg-white/10 hover:bg-white/20 text-slate-200 px-3 py-1 rounded-full whitespace-nowrap"
                >
                  🦵 ปวดเมื่อยกล้ามเนื้อต้นขา
                </button>
              </div>

              {/* Input */}
              <div className="flex gap-2 pt-2 border-t border-white/10">
                <input 
                  type="text" 
                  placeholder="พิมพ์อาการของคุณที่นี่..."
                  value={inputText}
                  onChange={e => setInputText(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                  className="flex-1 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs text-white focus:outline-none focus:border-aura-lime"
                />
                <button 
                  onClick={() => handleSendMessage()}
                  className="p-2.5 bg-aura-lime text-slate-950 font-black rounded-xl hover:bg-aura-limeDark"
                >
                  <Icon name="send" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Triage & Express Dispatch */}
            <div className={`p-5 rounded-3xl border space-y-4 ${darkMode ? 'glass-card-dark' : 'glass-card-light'}`}>
              <h3 className="text-sm font-bold">ผลการคัดกรองระดับอาการ (Triage)</h3>

              {triageResult ? (
                <div className="space-y-3">
                  <div className="p-3 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs">
                    <div className="text-[10px] font-bold uppercase">ระดับประเมิน:</div>
                    <div className="text-base font-black text-white mt-0.5">{triageResult.grade}</div>
                  </div>

                  <div className="text-xs text-slate-300 space-y-1">
                    <div className="font-bold text-white">คำแนะนำการปฏิบัติตัว:</div>
                    <p>{triageResult.recommendation}</p>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-950 border border-white/10 space-y-3">
                    <div className="text-xs font-bold text-aura-lime flex items-center gap-1">
                      <Icon name="zap" className="w-3.5 h-3.5" /> บริการส่งยาด่วนถึงบ้าน 1 ชม.
                    </div>
                    <div>
                      <div className="text-xs font-bold">{triageResult.bundleName}</div>
                      <div className="text-lg font-black text-aura-lime">{triageResult.price}</div>
                    </div>
                    <button 
                      onClick={() => showToast(`ยืนยันการจัดส่ง ${triageResult.bundleName} เรียบร้อย! 🛵`)}
                      className="w-full py-2 bg-aura-lime text-slate-950 font-black text-xs rounded-xl hover:bg-aura-limeDark transition-all"
                    >
                      ยืนยันการสั่งยาด่วน
                    </button>
                  </div>
                </div>
              ) : (
                <div className="text-center py-10 text-slate-400 text-xs space-y-2">
                  <Icon name="heart" className="w-8 h-8 mx-auto text-slate-600" />
                  <p>พิมพ์อธิบายอาการในช่องแชทเพื่อเริ่มวิเคราะห์ระดับความรุนแรง</p>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    // Mount Application cleanly with React 18 createRoot
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
